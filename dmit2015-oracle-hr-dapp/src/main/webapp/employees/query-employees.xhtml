<!-- This is a Faces composition page that extends the layout template -->
<ui:composition
        template="/WEB-INF/faces-templates/layout.xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:p="primefaces"
        xmlns:o="http://omnifaces.org/ui">

    <!-- Page metadata for title, description, and keywords -->
    <ui:param name="title" value="query-employees"/>

    <!-- Define main content for the page -->
    <ui:define name="maincontent">
        <div class="card">
            <h1 role="heading" aria-level="1">Employee Query</h1>
            <h:form id="query-employees_form" role="form">
                <p:panel header="Welcome to Employee Query">
                    <!-- Add page-specific content here, e.g., PrimeFaces components -->

                    <div class="field col-12 md:col-4">
                        <p:outputLabel value="Department Name" for="@next"/>
                        <p:autoComplete id="acDepartment"
                                        value="#{employeeQueryView.selectedDepartment}"
                                        completeMethod="#{employeeQueryView.completeDepartment}"
                                        var="dept"
                                        itemLabel="#{dept.departmentName}"
                                        itemValue="#{dept}"
                                        converter="#{departmentConverter}"
                                        forceSelection="true"
                                        scrollHeight="250"/>
                    </div>
                    <p:commandButton value="Search by Department"
                                     action="#{employeeQueryView.onSearchByDepartment()}"
                                     update=":messages :growl @form"
                                     />

                    <p:commandButton value="Cancel"
                                     action="#{employeeQueryView.onClear()}"
                                     update="@form" />

                <div class="field col-12 md:col-4">
                    <p:outputLabel value="Job Title" for="@next"/>
                    <p:autoComplete id="acJob"
                                    value="#{employeeQueryView.selectedJob}"
                                    completeMethod="#{employeeQueryView.completeJob}"
                                    var="currentJob"
                                    itemLabel="#{currentJob.jobTitle}"
                                    itemValue="#{currentJob}"
                                    converter="#{jobConverter}"
                                    forceSelection="true"
                                    scrollHeight="250"/>
                </div>

                    <p:commandButton value="Search by Job"
                                     action="#{employeeQueryView.onSearchByJob()}"
                                     update=":messages :growl dataTable"
                    />

                </p:panel>

                <p:dataTable id="dataTable"
                             value="#{employeeQueryView.queryResults}"
                             var="currentEmployee">
                    <p:column headerText="Full Name">
                        <h:outputText value="#{currentEmployee.fullName}" />
                    </p:column>

                    <p:column headerText="Hire Date">
                        <h:outputText value="#{currentEmployee.hireDate}">
                            <f:convertDateTime type="localDate" pattern="yyyy-MM-dd" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Salary">
                        <h:outputText value="#{currentEmployee.salary}">
                            <f:convertNumber type="currency"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Department Name">
                        <h:outputText value="#{currentEmployee.department.departmentName}" />
                    </p:column>

                    <p:column headerText="Job Title">
                        <h:outputText value="#{currentEmployee.job.jobTitle}" />
                    </p:column>

                    <p:column headerText="Manager Name">
<h:outputText value="#{(empty currentEmployee.manager) ? 'No Manager' : currentEmployee.manager.fullName}" />
                    </p:column>

                </p:dataTable>
            </h:form>



        </div>
    </ui:define>

</ui:composition>
